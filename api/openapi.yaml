openapi: 3.1.0
info:
  title: Neighborhood Surplus Food Market API (RescueBite)
  version: 0.1.0
  description: >
    Core RESTful API contract for the Neighborhood Surplus Food Market platform.
    Enables local bakeries, cafes, and grocery stores to list end-of-day surplus food items
    with transparent itemized contents, explicit quantities, allergen declarations, and discounted rates.
    Strictly avoids mystery or surprise packages. Allows budget-conscious and eco-friendly customers
    to inspect food contents before placing orders with doorstep courier delivery,
    enables merchants to update order preparation progress, coordinates atomic courier dispatch,
    verifies doorstep handover via dynamic single-use QR tokens, and tracks cumulative food waste diversion metrics.
    SENG 321 Software Engineering Project Sprint 1 API-first specification.
servers:
  - url: https://api.rescuebite.local/v1
    description: Local development and sandbox mock server
paths:
  /listings:
    get:
      summary: List available surplus food listings
      description: >
        Retrieves active surplus food listings filtered by geolocation coordinates, radius, food category,
        and dietary preferences. Every listing itemizes its contents and quantities so customers know exactly
        what they are purchasing.
      operationId: listAvailableListings
      tags:
        - Listings
      parameters:
        - name: latitude
          in: query
          required: false
          schema:
            type: number
            format: double
          example: 41.0082
        - name: longitude
          in: query
          required: false
          schema:
            type: number
            format: double
          example: 28.9784
        - name: radiusKm
          in: query
          required: false
          schema:
            type: integer
            default: 5
          example: 3
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [BAKERY, MEALS, GROCERY, CAFE, ALL]
            default: ALL
        - name: dietaryPreference
          in: query
          required: false
          schema:
            type: string
            enum: [ALL, VEGAN, VEGETARIAN, GLUTEN_FREE, HALAL, DAIRY_FREE]
            default: ALL
      responses:
        '200':
          description: List of active surplus food listings with transparent items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SurplusFoodListing'
        '400':
          $ref: '#/components/responses/BadRequest'

    post:
      summary: Create new surplus food listing (Approved Store)
      description: >
        Allows a verified merchant to list an end-of-day surplus food batch.
        The merchant must explicitly define the itemized contents, portions, allergens,
        total available listing quantity, and delivery time window.
      operationId: createListing
      tags:
        - Listings
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSurplusFoodListing'
      responses:
        '201':
          description: Surplus food listing successfully created and published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurplusFoodListing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Store is unverified or lacks merchant permissions
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Store Not Approved
                status: 403
                code: STORE_NOT_APPROVED
                detail: Merchant account must be approved by an administrator before creating surplus food listings.

  /listings/{listingId}:
    get:
      summary: Get surplus food listing details
      description: >
        Returns complete listing details including the transparent list of individual food items,
        quantities, allergen alerts, prices, and delivery time window.
      operationId: getListingById
      tags:
        - Listings
      parameters:
        - name: listingId
          in: path
          required: true
          schema:
            type: string
          example: LST-2026-0042
      responses:
        '200':
          description: Listing details and transparent food items breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurplusFoodListing'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders:
    post:
      summary: Place order for a surplus food listing (Customer)
      description: >
        Customer reserves a surplus food listing with doorstep delivery.
        Stock is reserved atomically. If the remaining available listing quantity is depleted
        by a concurrent request, an HTTP 409 Conflict (LISTING_SOLD_OUT) is returned.
        Payment authorization is simulated via a sandbox payment token.
      operationId: createOrder
      tags:
        - Orders
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewOrder'
      responses:
        '201':
          description: Order placed, queued for store preparation, and dynamic delivery QR token generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Requested listing is sold out, payment failed, or conflicted by concurrent purchase
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                listingSoldOut:
                  summary: Listing sold out
                  value:
                    title: Listing Sold Out
                    status: 409
                    code: LISTING_SOLD_OUT
                    detail: The selected surplus food listing is sold out or the last unit was claimed by another customer.
                paymentFailed:
                  summary: Payment authorization failed
                  value:
                    title: Payment Authorization Failed
                    status: 409
                    code: PAYMENT_AUTHORIZATION_FAILED
                    detail: The payment gateway rejected the transaction token. The order was not created.

  /orders/{orderId}:
    get:
      summary: Get order details and delivery verification QR token
      description: >
        Retrieves order information, status lifecycle milestone, assigned courier,
        and the customer dynamic delivery QR token for doorstep handover verification.
      operationId: getOrderById
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          example: ORD-2026-9812
      responses:
        '200':
          description: Order details, courier status, and customer delivery QR token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderId}/status:
    patch:
      summary: Update order preparation status (Store)
      description: >
        Allows the authenticated merchant to update the preparation state of an order.
        Valid transitions are PLACED -> PREPARING and PREPARING -> READY_FOR_COURIER.
        Once an order reaches READY_FOR_COURIER, it becomes available in the courier delivery pool.
      operationId: updateOrderStatus
      tags:
        - Orders
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          example: ORD-2026-9812
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdate'
      responses:
        '200':
          description: Order status successfully transitioned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the merchant that owns this order
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Forbidden Store Action
                status: 403
                code: FORBIDDEN_STORE_ACTION
                detail: Only the merchant fulfilling this order is authorized to update its preparation status.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invalid order status transition sequence
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Invalid Status Transition
                status: 409
                code: INVALID_STATUS_TRANSITION
                detail: Cannot transition order from PLACED directly to READY_FOR_COURIER without PREPARING.

  /deliveries/available:
    get:
      summary: List available deliveries for couriers
      description: Lists orders that have reached READY_FOR_COURIER status and are awaiting courier pickup.
      operationId: listAvailableDeliveries
      tags:
        - Deliveries
      security:
        - BearerAuth: []
      parameters:
        - name: latitude
          in: query
          required: true
          schema:
            type: number
            format: double
          example: 40.9856
        - name: longitude
          in: query
          required: true
          schema:
            type: number
            format: double
          example: 29.0289
      responses:
        '200':
          description: List of orders ready for courier pickup and delivery
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /deliveries/{orderId}/claim:
    post:
      summary: Courier claims a delivery order
      description: >
        Courier assigns the delivery to themselves. Transitions order from READY_FOR_COURIER
        to IN_DELIVERY. If claimed concurrently by another courier, returns HTTP 409 Conflict.
      operationId: claimDelivery
      tags:
        - Deliveries
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          example: ORD-2026-9812
      responses:
        '200':
          description: Order successfully claimed and transitioned to IN_DELIVERY
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Order already claimed by another courier
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Delivery Already Claimed
                status: 409
                code: DELIVERY_ALREADY_CLAIMED
                detail: This delivery was already assigned to another courier moments ago.

  /deliveries/{orderId}/verify-qr:
    post:
      summary: Verify doorstep delivery via customer dynamic QR token (Courier)
      description: >
        The courier scans the customer dynamic QR code upon arrival at the delivery address.
        The token is validated for authenticity, single-use, and active delivery time window.
        On success, order transitions to DELIVERED, deliveredAt is set, and rescued food weight is recorded.
      operationId: verifyDeliveryQR
      tags:
        - Deliveries
      security:
        - BearerAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          example: ORD-2026-9812
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QRVerificationRequest'
      responses:
        '200':
          description: Delivery QR validated and order completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is not the assigned courier for this delivery
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                title: Unauthorized Courier Verification
                status: 403
                code: UNAUTHORIZED_COURIER
                detail: Only the courier assigned to this delivery can submit the verification token.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Invalid QR token, token already redeemed, or expired delivery window
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                invalidOrUsedQr:
                  summary: Invalid or already used QR token
                  value:
                    title: Invalid Delivery Verification
                    status: 409
                    code: INVALID_QR_VERIFICATION
                    detail: The scanned QR token is invalid, cryptographically mismatched, or has already been redeemed.
                expiredWindow:
                  summary: Expired delivery window
                  value:
                    title: Expired Delivery Window
                    status: 409
                    code: EXPIRED_DELIVERY_WINDOW
                    detail: The scheduled delivery time window for this order has already passed.

  /admin/stores/{storeId}/approve:
    patch:
      summary: Approve or suspend store registration (Platform Admin)
      description: Administrator inspects merchant food hygiene licenses and registration documents and updates approval status.
      operationId: updateStoreApproval
      tags:
        - Admin
      security:
        - BearerAuth: []
      parameters:
        - name: storeId
          in: path
          required: true
          schema:
            type: string
          example: STR-34-KADIKOY
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [isApproved]
              properties:
                isApproved:
                  type: boolean
                  example: true
                adminNotes:
                  type: string
                  example: Merchant hygiene license verified and approved for surplus food listing operations.
      responses:
        '200':
          description: Merchant approval status successfully updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /metrics/food-waste:
    get:
      summary: Cumulative food waste rescue metrics
      description: >
        Aggregates environmental impact statistics across all completed orders with status DELIVERED.
        Cancelled, refunded, or unfulfilled orders are strictly excluded from rescued food calculations.
      operationId: getFoodWasteMetrics
      tags:
        - Metrics
      responses:
        '200':
          description: Food waste prevention and environmental impact metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodWasteMetrics'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    StoreSummary:
      type: object
      required:
        - storeId
        - storeName
        - address
        - isApproved
      properties:
        storeId:
          type: string
          example: STR-34-KADIKOY
        storeName:
          type: string
          example: Kadikoy Artisan Bakery
        category:
          type: string
          example: BAKERY
        address:
          type: string
          example: 12 Sair Nefi Street, Kadikoy, Istanbul
        latitude:
          type: number
          example: 40.9856
        longitude:
          type: number
          example: 29.0289
        isApproved:
          type: boolean
          example: true

    ListingItem:
      type: object
      description: Individual food item explicitly listed within a surplus food listing
      required:
        - itemId
        - itemName
        - quantity
        - unit
        - allergens
      properties:
        itemId:
          type: string
          example: ITM-01
        itemName:
          type: string
          example: Artisan Sourdough Bread
        quantity:
          type: integer
          minimum: 1
          example: 2
        unit:
          type: string
          example: loaf
        allergens:
          type: array
          items:
            type: string
          example: [gluten]
        description:
          type: string
          example: Naturally leavened sourdough bread baked this morning.

    NewListingItem:
      type: object
      description: Specification of an individual food item to include in a new listing
      required:
        - itemName
        - quantity
        - unit
        - allergens
      properties:
        itemName:
          type: string
          example: Butter Croissant
        quantity:
          type: integer
          minimum: 1
          example: 3
        unit:
          type: string
          example: piece
        allergens:
          type: array
          items:
            type: string
          example: [gluten, dairy]
        description:
          type: string
          example: Fresh flaky butter croissants.

    SurplusFoodListing:
      type: object
      description: >
        Transparent surplus food listing published by an approved merchant.
        Itemizes all included food items and quantities so customers know exactly what they are purchasing.
      required:
        - listingId
        - store
        - title
        - category
        - originalPrice
        - discountedPrice
        - availableListingQuantity
        - estimatedWeightKg
        - deliveryStart
        - deliveryEnd
        - status
        - items
      properties:
        listingId:
          type: string
          example: LST-2026-0042
        store:
          $ref: '#/components/schemas/StoreSummary'
        title:
          type: string
          example: Evening Bakery Surplus: 2 Sourdough Loaves & 3 Butter Croissants
        category:
          type: string
          enum: [BAKERY, MEALS, GROCERY, CAFE]
          example: BAKERY
        description:
          type: string
          example: Transparent end-of-day surplus listing containing freshly baked loaves and artisan butter croissants.
        originalPrice:
          type: number
          format: float
          example: 240.00
        discountedPrice:
          type: number
          format: float
          example: 80.00
        availableListingQuantity:
          type: integer
          description: Total number of these identical surplus food listing bundles available for purchase
          minimum: 0
          example: 5
        estimatedWeightKg:
          type: number
          format: float
          description: Estimated total weight of all items in this listing bundle
          example: 1.5
        deliveryStart:
          type: string
          format: date-time
          example: '2026-11-02T19:30:00Z'
        deliveryEnd:
          type: string
          format: date-time
          example: '2026-11-02T21:30:00Z'
        dietaryPreferences:
          type: array
          items:
            type: string
          example: [VEGETARIAN]
        status:
          type: string
          enum: [AVAILABLE, SOLD_OUT, EXPIRED]
          example: AVAILABLE
        items:
          type: array
          description: Transparent, itemized food contents of this listing
          items:
            $ref: '#/components/schemas/ListingItem'

    NewSurplusFoodListing:
      type: object
      description: Merchant creation payload for an open, itemized surplus food listing
      required:
        - title
        - category
        - originalPrice
        - discountedPrice
        - initialListingQuantity
        - estimatedWeightKg
        - deliveryStart
        - deliveryEnd
        - items
      properties:
        title:
          type: string
          example: Evening Bakery Surplus: 2 Sourdough Loaves & 3 Butter Croissants
        category:
          type: string
          enum: [BAKERY, MEALS, GROCERY, CAFE]
          example: BAKERY
        description:
          type: string
          example: Surplus daily production items packaged for evening doorstep delivery.
        originalPrice:
          type: number
          format: float
          example: 240.00
        discountedPrice:
          type: number
          format: float
          example: 80.00
        initialListingQuantity:
          type: integer
          description: Total number of identical listing units being offered
          minimum: 1
          example: 5
        estimatedWeightKg:
          type: number
          format: float
          example: 1.5
        deliveryStart:
          type: string
          format: date-time
          example: '2026-11-02T19:30:00Z'
        deliveryEnd:
          type: string
          format: date-time
          example: '2026-11-02T21:30:00Z'
        dietaryPreferences:
          type: array
          items:
            type: string
          example: [VEGETARIAN]
        items:
          type: array
          description: Transparent breakdown of food items and quantities
          minItems: 1
          items:
            $ref: '#/components/schemas/NewListingItem'

    NewOrder:
      type: object
      description: Customer checkout request reserving one or more units of a specific surplus food listing
      required:
        - listingId
        - quantity
        - deliveryAddress
        - paymentToken
      properties:
        listingId:
          type: string
          description: Identifier of the surplus food listing being ordered
          example: LST-2026-0042
        quantity:
          type: integer
          description: Number of listing units purchased by the customer
          minimum: 1
          maximum: 5
          example: 1
        deliveryAddress:
          type: object
          required: [street, buildingNo, district, city, fullAddress]
          properties:
            street:
              type: string
              example: Moda Avenue
            buildingNo:
              type: string
              example: '45/3'
            district:
              type: string
              example: Kadikoy
            city:
              type: string
              example: Istanbul
            fullAddress:
              type: string
              example: 45 Moda Avenue, Apt 3, Kadikoy, Istanbul
            deliveryInstructions:
              type: string
              example: Please do not ring the doorbell.
        paymentToken:
          type: string
          description: Mock payment token from sandbox payment gateway
          example: pay_tok_sand_982394_visa

    OrderStatusUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [PREPARING, READY_FOR_COURIER]
          example: PREPARING
        notes:
          type: string
          example: Items packed and sealed in tamper-evident paper bags.

    Order:
      type: object
      description: Comprehensive representation of an order across its lifecycle
      required:
        - orderId
        - listingId
        - listingTitle
        - customerId
        - store
        - quantity
        - items
        - totalPrice
        - status
        - deliveryStart
        - deliveryEnd
        - deliveryQrToken
        - estimatedWeightSavedKg
        - createdAt
      properties:
        orderId:
          type: string
          example: ORD-2026-9812
        listingId:
          type: string
          example: LST-2026-0042
        listingTitle:
          type: string
          example: Evening Bakery Surplus: 2 Sourdough Loaves & 3 Butter Croissants
        customerId:
          type: string
          example: CUST-7741
        courierId:
          type: string
          nullable: true
          example: CR-18
        store:
          $ref: '#/components/schemas/StoreSummary'
        quantity:
          type: integer
          example: 1
        items:
          type: array
          description: Transparent itemized food contents confirmed in the order
          items:
            $ref: '#/components/schemas/ListingItem'
        totalPrice:
          type: number
          format: float
          example: 80.00
        estimatedWeightSavedKg:
          type: number
          format: float
          example: 1.5
        status:
          type: string
          enum: [PLACED, PREPARING, READY_FOR_COURIER, IN_DELIVERY, DELIVERED, CANCELLED]
          example: PLACED
        deliveryStart:
          type: string
          format: date-time
          example: '2026-11-02T19:30:00Z'
        deliveryEnd:
          type: string
          format: date-time
          example: '2026-11-02T21:30:00Z'
        deliveryQrToken:
          type: string
          description: Single-use cryptographic token presented by customer at doorstep for proof of delivery
          example: QR-SEC-9812-VERIFY-HASH
        deliveredAt:
          type: string
          format: date-time
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
          example: '2026-11-02T18:15:00Z'

    QRVerificationRequest:
      type: object
      required:
        - deliveryQrToken
      properties:
        deliveryQrToken:
          type: string
          description: Scanned single-use delivery verification QR token from the customer screen
          example: QR-SEC-9812-VERIFY-HASH

    FoodWasteMetrics:
      type: object
      description: Aggregated ecological impact statistics derived exclusively from DELIVERED orders
      required:
        - totalRescuedWeightKg
        - totalDeliveredOrders
        - totalListingsRescued
        - co2EmissionsPreventedKg
        - calculatedAt
      properties:
        totalRescuedWeightKg:
          type: number
          format: float
          description: Cumulative kilograms of surplus food diverted from waste
          example: 642.5
        totalDeliveredOrders:
          type: integer
          description: Count of successfully completed deliveries
          example: 418
        totalListingsRescued:
          type: integer
          description: Total number of surplus listing bundles purchased and delivered
          example: 450
        co2EmissionsPreventedKg:
          type: number
          format: float
          description: Estimated greenhouse gas emissions averted (approx. 2.5 kg CO2e per kg food saved)
          example: 1606.25
        calculatedAt:
          type: string
          format: date-time
          example: '2026-11-05T12:00:00Z'

    Problem:
      type: object
      description: RFC 7807 and RFC 9457 compliant error problem detail
      required:
        - title
        - status
        - code
        - detail
      properties:
        title:
          type: string
          example: Request Failed
        status:
          type: integer
          example: 400
        code:
          type: string
          example: VALIDATION_ERROR
        detail:
          type: string
          example: Business rule validation failed or conflict detected.

  responses:
    BadRequest:
      description: Invalid query parameters or request body schema
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Unauthorized:
      description: Authentication failed or bearer token missing
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    Forbidden:
      description: Insufficient role permissions or unverified store
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

    NotFound:
      description: Requested resource was not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
